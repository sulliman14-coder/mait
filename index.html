      { id:'1', companyName:'شركة الفوزان للمقاولات', industry:'مقاولات', city:'الرياض', email:'a@a.sa', phone:'+9665000000', whatsapp:'+9665000000', website:'www.test.sa', linkedin:'', aiScore:94, needsHeavyTransport:true, needsLogistics:false, needsCarsTransport:false, intentLevel:'HIGH', aiSummary:'مشروع توسعة', status:'INTERESTED', createdAt:'2026-05-10', notes:[], tasks:[] },
      { id:'2', companyName:'مصانع السلوى', industry:'أغذية', city:'جدة', email:'b@b.sa', phone:'+9665111111', whatsapp:'+9665111111', website:'', linkedin:'', aiScore:89, needsHeavyTransport:false, needsLogistics:true, needsCarsTransport:false, intentLevel:'HIGH', aiSummary:'نقل مبرد', status:'QUOTATION_SENT', createdAt:'2026-05-11', notes:[], tasks:[] },

      const [discIndustry, setDiscIndustry] = React.useState('مقاولات');

      const [discovered, setDiscovered] = React.useState([]);
      const [crmFilter, setCrmFilter] = React.useState('ALL');

      const [selectedEmail, setSelectedEmail] = React.useState(initialEmails[0]);
      const [selectedWaLead, setSelectedWaLead] = React.useState('1');
      const [emailModal, setEmailModal] = React.useState(false);
      const [emailTo, setEmailTo] = React.useState('');
      const [emailSubject, setEmailSubject] = React.useState('');
      const [emailBody, setEmailBody] = React.useState('');

      const [apiKeys, setApiKeys] = React.useState(() => {
        const saved = localStorage.getItem('mati_api_keys');
        return saved ? JSON.parse(saved) : defaultKeys;
      });

      React.useEffect(() => localStorage.setItem('mati_leads', JSON.stringify(leads)), [leads]);
      React.useEffect(() => localStorage.setItem('mati_api_keys', JSON.stringify(apiKeys)), [apiKeys]);

        const id = Date.now();
        setToasts(p => [...p, {id, msg, type}]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
      };

      const handleSaveApiKeys = () => {
        localStorage.setItem('mati_api_keys', JSON.stringify(apiKeys));
        showToast('تم حفظ جميع مفاتيح API بنجاح!', 'success');
      };

      const handleDiscovery = () => {
        setIsDiscovering(true);
        setTimeout(() => {
          const newLeads = [
            { id:'d1', companyName:'شركة البنيان', industry:discIndustry, city:discCity, email:'test@test.sa', phone:'+966...', whatsapp:'+966...', website:'', linkedin:'', aiScore:88, needsHeavyTransport:true, needsLogistics:false, needsCarsTransport:false, intentLevel:'HIGH', aiSummary:'...', status:'NEW', createdAt:'2026-05-19', notes:[], tasks:[] },
            { id:'d2', companyName:'مؤسسة روافد', industry:discIndustry, city:discCity, email:'test2@test.sa', phone:'+966...', whatsapp:'+966...', website:'', linkedin:'', aiScore:82, needsHeavyTransport:false, needsLogistics:true, needsCarsTransport:false, intentLevel:'MEDIUM', aiSummary:'...', status:'NEW', createdAt:'2026-05-19', notes:[], tasks:[] }
          ];
          setDiscovered(newLeads);
          setIsDiscovering(false);
          showToast('تم العثور على عميلين محتملين', 'success');
        }, 2000);
      };

      const importToCRM = (lead) => {
        if (!leads.find(l => l.companyName === lead.companyName)) {
          setLeads(p => [lead, ...p]);
          showToast('تم إضافة العميل إلى CRM', 'success');
        } else showToast('العميل موجود مسبقاً', 'error');
      };

        const active = activeTab === id;
        const Icon = Icons[icon];
        return (

            <Icon size={18} className={active ? 'text-blue-600' : 'text-gray-500'} />
            {sidebarOpen && <span className="text-sm">{label}</span>}
            {sidebarOpen && badge}
          </button>
        );
      };

      const getStatusBadge = (status) => {
        const map = { NEW: 'جديد', CONTACTED: 'تم التواصل', FOLLOW_UP: 'متابعة', INTERESTED: 'مهتم', QUOTATION_SENT: 'تم إرسال العرض', NEGOTIATION: 'تفاوض', WON: 'مكتسبة', LOST: 'خاسرة' };
        return <span className="px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-700">{map[status]||status}</span>;
      };

        <div className="flex h-screen bg-gray-50 text-gray-900 overflow-hidden" dir="rtl">

                {t.type==='error'&&<Icons.AlertTriangle className="text-rose-500" size={20}/>}
                {t.type==='info'&&<Icons.Info className="text-blue-500" size={20}/>}

              </div>

              <SidebarItem id="crm" icon="Users" label="إدارة المبيعات" badge={<span className="bg-gray-100 text-xs px-2 rounded-full">{leads.length}</span>} />

              <SidebarItem id="whatsapp" icon="MessageSquare" label="واتساب" />
              {sidebarOpen && <p className="px-2 text-[10px] font-bold text-gray-400 uppercase mb-2 mt-4">المراقبة</p>}

            </nav>
            <div className={`p-4 border-t bg-gray-50 flex items-center ${sidebarOpen?'gap-3':'justify-center'}`}>
              <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center font-bold">M</div>
              {sidebarOpen && <div><p className="text-sm font-bold">أدمن MATI</p><p className="text-[10px] text-gray-500">admin@mati.sa</p></div>}
            </div>
          </aside>

          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            <header className="h-16 border-b bg-white flex items-center justify-between px-6 shrink-0 shadow-sm">
              <div className="flex items-center gap-4">
                <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                  {sidebarOpen ? <Icons.X size={20}/> : <Icons.Menu size={20}/>}
                </button>
                <h2 className="text-lg font-bold hidden sm:block">
                  {activeTab==='dashboard'&&'لوحة المؤشرات'}{activeTab==='discovery'&&'محرك البحث'}{activeTab==='crm'&&'إدارة العملاء'}{activeTab==='email'&&'البريد الوارد'}{activeTab==='whatsapp'&&'واتساب'}{activeTab==='tenders'&&'المناقصات'}{activeTab==='deliverability'&&'حماية البريد'}{activeTab==='integrations'&&'إعدادات الربط'}
                </h2>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-xs text-gray-500 hidden md:block">نطاق التشغيل: <span className="text-blue-700 font-bold bg-blue-50 px-2 py-1 rounded-md">السعودية</span></span>
                <button className="relative p-2 text-gray-400"><Icons.Bell size={20}/><span className="absolute top-1.5 right-2 w-2 h-2 bg-rose-500 rounded-full"></span></button>
              </div>
            </header>
            <div className="flex-1 overflow-y-auto p-6 md:p-8">
              {activeTab === 'dashboard' && <Dashboard leads={leads} setActiveTab={setActiveTab} />}
              {activeTab === 'discovery' && <Discovery discCity={discCity} setDiscCity={setDiscCity} discIndustry={discIndustry} setDiscIndustry={setDiscIndustry} isDiscovering={isDiscovering} onDiscover={handleDiscovery} discovered={discovered} onImport={importToCRM} />}
              {activeTab === 'crm' && <CRM leads={leads} filter={crmFilter} setFilter={setCrmFilter} selected={selectedLead} setSelected={setSelectedLead} showToast={showToast} />}
              {activeTab === 'email' && <EmailInbox emails={emails} selectedEmail={selectedEmail} setSelectedEmail={setSelectedEmail} onOpenModal={() => setEmailModal(true)} />}
              {activeTab === 'whatsapp' && <WhatsApp leads={leads} messages={waMessages} selectedId={selectedWaLead} setSelectedId={setSelectedWaLead} showToast={showToast} />}
              {activeTab === 'tenders' && <Tenders tenders={tenders} />}
              {activeTab === 'deliverability' && <Deliverability />}
              {activeTab === 'integrations' && <Integrations apiKeys={apiKeys} setApiKeys={setApiKeys} onSave={handleSaveApiKeys} />}
            </div>
          </div>

          {emailModal && (
            <div className="fixed inset-0 z-50 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh]">
                <div className="p-5 border-b bg-gray-50 flex justify-between items-center">
                  <h4 className="font-bold text-lg">صياغة وإرسال رسالة</h4>
                  <button onClick={()=>setEmailModal(false)} className="p-1.5 rounded-lg bg-gray-200"><Icons.X size={20}/></button>
                </div>
                <div className="p-6 space-y-5 overflow-y-auto flex-1">
                  <div><label className="text-xs font-bold text-gray-600 block mb-1">المرسل إليه</label><input type="email" value={emailTo} onChange={e=>setEmailTo(e.target.value)} className="w-full border rounded-xl px-4 py-3 text-sm" dir="ltr"/></div>
                  <div><label className="text-xs font-bold text-gray-600 block mb-1">الموضوع</label><input type="text" value={emailSubject} onChange={e=>setEmailSubject(e.target.value)} className="w-full border rounded-xl px-4 py-3 text-sm"/></div>
                  <div><label className="text-xs font-bold text-gray-600 block mb-1">نص الرسالة</label><textarea rows={9} value={emailBody} onChange={e=>setEmailBody(e.target.value)} className="w-full border rounded-xl px-4 py-3 text-sm leading-loose"/></div>
                </div>
                <div className="p-5 border-t bg-gray-50 flex justify-end gap-3">
                  <button onClick={()=>setEmailModal(false)} className="bg-white border rounded-xl px-4 py-2 text-sm font-bold">إلغاء</button>
                  <button onClick={()=>{ if(emailTo&&emailSubject){ showToast('تم الإرسال (محاكاة)','success'); setEmailModal(false); } }} className="bg-blue-600 text-white rounded-xl px-6 py-2 text-sm font-bold flex items-center gap-2"><Icons.Send size={16}/> إرسال</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ========== المكونات الداخلية ==========
    const Dashboard = ({ leads, setActiveTab }) => (
      <div className="space-y-8 animate-fadeIn">
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {[{icon:'Users',label:'عملاء CRM',value:leads.length},{icon:'TrendingUp',label:'إيراد متوقع',value:'142,000 ريال'},{icon:'Mail',label:'تسليم البريد',value:'99.8%'},{icon:'MessageSquare',label:'رسائل واتساب',value:'154'}].map(s=><StatCard key={s.label} {...s}/>)}
        </div>
        <div className="bg-white rounded-2xl shadow-sm p-6 border">
          <div className="flex justify-between mb-4"><h4 className="font-bold">قائمة العملاء</h4><button onClick={()=>setActiveTab('crm')} className="text-blue-600 text-xs flex items-center gap-1 font-semibold">الذهاب للـ CRM <Icons.ChevronLeft size={14}/></button></div>
          <table className="w-full text-right">
            <thead className="bg-gray-50 text-xs font-semibold"><tr><th className="px-4 py-3">الشركة</th><th className="px-4 py-3">النشاط</th><th className="px-4 py-3">المدينة</th><th className="px-4 py-3">AI Score</th><th className="px-4 py-3">الحالة</th></tr></thead>
            <tbody className="divide-y">{leads.map(l=><tr key={l.id} className="hover:bg-gray-50"><td className="px-4 py-3 font-bold">{l.companyName}</td><td className="px-4 py-3 text-xs bg-gray-100 rounded px-2">{l.industry}</td><td className="px-4 py-3 flex items-center gap-1"><Icons.MapPin size={12}/>{l.city}</td><td className="px-4 py-3"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${l.aiScore>90?'bg-emerald-100 text-emerald-700':l.aiScore>80?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}`}>{l.aiScore}%</span></td><td className="px-4 py-3"><StatusBadge status={l.status}/></td></tr>)}</tbody>
          </table>
        </div>
      </div>
    );
    const StatCard = ({icon,label,value}) => { const Icon = Icons[icon]; return <div className="bg-white border p-6 rounded-2xl shadow-sm flex items-center gap-4"><div className="p-3.5 bg-blue-50 text-blue-600 rounded-xl"><Icon size={24}/></div><div><p className="text-xs text-gray-500">{label}</p><h3 className="text-2xl font-black mt-1">{value}</h3></div></div>; };
    const StatusBadge = ({status}) => { const map={NEW:'جديد',CONTACTED:'تم التواصل',FOLLOW_UP:'متابعة',INTERESTED:'مهتم',QUOTATION_SENT:'تم العرض',NEGOTIATION:'تفاوض',WON:'مكتسبة',LOST:'خاسرة'}; return <span className="px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-700">{map[status]||status}</span>; };
    const Discovery = ({discCity,setDiscCity,discIndustry,setDiscIndustry,isDiscovering,onDiscover,discovered,onImport}) => (
      <div className="space-y-6 animate-fadeIn">
        <div className="bg-white border p-6 rounded-2xl shadow-sm">
          <h3 className="font-bold text-xl mb-4">محرك البحث الذكي</h3>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div><label className="text-xs font-bold mb-2 block">المدينة</label><select value={discCity} onChange={e=>setDiscCity(e.target.value)} className="w-full border rounded-xl px-4 py-3 text-sm"><option>الرياض</option><option>جدة</option><option>الدمام</option></select></div>
            <div><label className="text-xs font-bold mb-2 block">النشاط</label><select value={discIndustry} onChange={e=>setDiscIndustry(e.target.value)} className="w-full border rounded-xl px-4 py-3 text-sm"><option>مقاولات</option><option>أغذية</option><option>مصانع</option><option>تجارة إلكترونية</option></select></div>
            <div className="flex items-end"><button onClick={onDiscover} disabled={isDiscovering} className="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2 disabled:bg-blue-400">{isDiscovering?<><Icons.Loader2 className="animate-spin" size={18}/> جاري الزحف...</>:<><Icons.Search size={18}/> بدء التنقيب</>}</button></div>
          </div>
        </div>
        {discovered.length>0 && <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">{discovered.map(l=><div key={l.id} className="bg-white border p-6 rounded-2xl shadow-sm"><h4 className="font-bold text-lg">{l.companyName}</h4><p className="text-xs text-gray-500">{l.city} • {l.industry}</p><div className="mt-4 flex gap-2"><button onClick={()=>onImport(l)} className="bg-gray-100 text-xs font-bold py-2 px-4 rounded-xl"><Icons.Plus size={14}/> استيراد للـ CRM</button></div></div>)}</div>}
      </div>
    );
    const CRM = ({leads,filter,setFilter,selected,setSelected,showToast}) => (
      <div className="space-y-6 animate-fadeIn">
        <div className="flex gap-2 flex-wrap">
          {['ALL','NEW','INTERESTED','QUOTATION_SENT','NEGOTIATION','WON'].map(s=><button key={s} onClick={()=>setFilter(s)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${filter===s?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'}`}>{s==='ALL'?'الكل':s}</button>)}
        </div>
        <div className="grid grid-cols-1 xl:grid-cols-4 gap-6">
          <div className="xl:col-span-3 space-y-4">
            {leads.filter(l=>filter==='ALL'||l.status===filter).map(l=><div key={l.id} onClick={()=>setSelected(l)} className="bg-white border p-5 rounded-2xl shadow-sm hover:border-blue-300 cursor-pointer"><div className="flex justify-between"><div><h4 className="font-bold">{l.companyName}</h4><p className="text-xs text-gray-500">{l.city} • {l.industry}</p></div><StatusBadge status={l.status}/></div></div>)}
          </div>
          <div className="bg-white border rounded-2xl p-6 shadow-sm">{selected?<div><h4 className="font-bold text-lg mb-4">{selected.companyName}</h4><p className="text-sm text-gray-500 mb-2">📞 {selected.phone}</p><p className="text-sm text-gray-500">📧 {selected.email}</p></div>:<p className="text-center text-gray-400">اختر عميلاً لعرض التفاصيل</p>}</div>
        </div>
      </div>
    );
    const EmailInbox = ({emails,selectedEmail,setSelectedEmail,onOpenModal}) => (
      <div className="h-[75vh] flex flex-col animate-fadeIn">
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 overflow-hidden">
          <div className="bg-white border rounded-2xl flex flex-col overflow-hidden">
            <div className="p-5 border-b bg-gray-50 font-bold">البريد الوارد</div>
            <div className="flex-1 overflow-y-auto divide-y">{emails.map(e=><div key={e.id} onClick={()=>setSelectedEmail(e)} className={`p-4 cursor-pointer hover:bg-gray-50 border-r-4 ${selectedEmail?.id===e.id?'border-blue-500 bg-blue-50/50':'border-transparent'}`}><h5 className="font-bold text-sm truncate">{e.leadName}</h5><p className="text-xs text-gray-500 truncate">{e.subject}</p></div>)}</div>
          </div>
          <div className="lg:col-span-2 bg-white border rounded-2xl flex flex-col overflow-hidden">{selectedEmail?<div className="flex flex-col h-full"><div className="p-6 border-b"><h3 className="font-bold">{selectedEmail.subject}</h3><p className="text-sm text-gray-500">من: {selectedEmail.leadName}</p></div><div className="p-6 flex-1 overflow-y-auto bg-gray-50/30"><div className="bg-white p-6 rounded-2xl border whitespace-pre-wrap">{selectedEmail.body}</div></div><div className="p-4 border-t flex gap-2"><button onClick={onOpenModal} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold">رد</button></div></div>:<div className="m-auto text-gray-400">اختر رسالة</div>}</div>
        </div>
      </div>
    );
    const WhatsApp = ({leads,messages,selectedId,setSelectedId,showToast}) => (
      <div className="h-[75vh] flex flex-col animate-fadeIn">
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 overflow-hidden">
          <div className="bg-white border rounded-2xl flex flex-col overflow-hidden">
            <div className="p-5 border-b bg-gray-50 font-bold">المحادثات</div>
            <div className="flex-1 overflow-y-auto divide-y">{leads.map(l=><div key={l.id} onClick={()=>setSelectedId(l.id)} className={`p-4 cursor-pointer hover:bg-gray-50 border-r-4 ${selectedId===l.id?'border-blue-500 bg-blue-50/50':'border-transparent'}`}><h5 className="font-bold text-sm">{l.companyName}</h5></div>)}</div>
          </div>
          <div className="lg:col-span-2 bg-[#efeae2] border rounded-2xl flex flex-col overflow-hidden relative">
            <div className="p-4 border-b bg-[#f0f2f5] font-bold">{leads.find(l=>l.id===selectedId)?.companyName}</div>
            <div className="flex-1 p-6 overflow-y-auto space-y-4 z-10">{messages.filter(m=>m.leadId===selectedId).map(m=><div key={m.id} className={`flex flex-col max-w-[75%] rounded-lg p-3 shadow-sm ${m.direction==='INBOUND'?'bg-white self-start':'bg-[#d9fdd3] self-end'}`}><span className="text-[10px] font-bold text-gray-500 mb-1">{m.senderName}</span><p className="text-[13px]">{m.text}</p><span className="text-[9px] text-gray-400 mt-1">{m.timestamp}</span></div>)}</div>
            <div className="p-3 bg-[#f0f2f5] flex gap-2"><input placeholder="اكتب رسالة..." className="flex-1 rounded-xl px-4 py-2 text-sm border-none outline-none"/><button className="bg-[#00a884] text-white p-3 rounded-full"><Icons.Send size={20}/></button></div>
          </div>
        </div>
      </div>
    );
    const Tenders = ({tenders}) => (
      <div className="space-y-6 animate-fadeIn"><div className="bg-white border p-6 rounded-2xl"><h3 className="font-bold text-xl mb-2">مراقب المناقصات</h3><p className="text-sm text-gray-500">يراقب النظام بوابات الشراء والمناقصات.</p></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-6">{tenders.map(t=><div key={t.id} className="bg-white border p-6 rounded-2xl"><h4 className="font-bold text-lg">{t.title}</h4><p className="text-sm text-gray-500 mt-2">{t.source}</p><p className="text-xs text-rose-500 mt-2">آخر موعد: {t.deadline}</p></div>)}</div></div>
    );
    const Deliverability = () => (
      <div className="space-y-6 animate-fadeIn"><div className="grid grid-cols-1 md:grid-cols-3 gap-6"><div className="bg-white border p-6 rounded-2xl text-center"><h4 className="text-xs font-bold text-gray-500">سمعة الدومين</h4><p className="text-3xl font-black text-emerald-600 mt-3">ممتازة</p></div><div className="bg-white border p-6 rounded-2xl text-center"><h4 className="text-xs font-bold text-gray-500">رسائل اليوم</h4><p className="text-3xl font-black text-blue-600 mt-3">42</p></div><div className="bg-white border p-6 rounded-2xl text-center"><h4 className="text-xs font-bold text-gray-500">معدل الإرتداد</h4><p className="text-3xl font-black text-emerald-600 mt-3">0.2%</p></div></div><div className="bg-white border rounded-2xl p-6"><h4 className="font-bold text-lg mb-4">فحوصات الأمان</h4><div className="divide-y">{['SPF','DKIM','DMARC','القوائم السوداء'].map(d=><div key={d} className="py-4 flex justify-between"><span className="font-bold">{d}</span><span className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1"><Icons.CheckCircle size={16}/> سليم</span></div>)}</div></div></div>
    );

    // ========== مكون الإعدادات (Integrations) الموسع ==========
    const Integrations = ({ apiKeys, setApiKeys, onSave }) => {
      const updateKey = (key) => (e) => setApiKeys(prev => ({...prev, [key]: e.target.value}));
      return (
        <div className="space-y-8 max-w-5xl mx-auto animate-fadeIn">
          <div className="bg-white border p-6 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h3 className="font-bold text-xl">إعدادات الربط والـ APIs</h3>
              <p className="text-gray-500 text-sm mt-1">أدخل مفاتيح API للخدمات التي تريد استخدامها. سيتم تخزينها محلياً في متصفحك.</p>
            </div>
            <button onClick={onSave} className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-3 px-6 rounded-xl transition flex items-center gap-2 shadow-md">
              <Icons.CheckCircle size={18} /> حفظ جميع المفاتيح
            </button>
          </div>

          {/* AI APIs */}
          <div className="bg-white border rounded-2xl p-6 shadow-sm space-y-6">
            <h4 className="font-bold text-lg flex items-center gap-2 border-b pb-4"><Icons.Cpu className="text-blue-600" size={20}/> منصات الذكاء الاصطناعي</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <ApiKeyField label="OpenAI API Key" value={apiKeys.openai} onChange={updateKey('openai')} placeholder="sk-proj-..." />
              <ApiKeyField label="Anthropic Claude API Key" value={apiKeys.claude} onChange={updateKey('claude')} placeholder="sk-ant-..." />
              <ApiKeyField label="Google Gemini API Key" value={apiKeys.gemini} onChange={updateKey('gemini')} placeholder="AIza..." />
            </div>
          </div>

          {/* Email APIs */}
          <div className="bg-white border rounded-2xl p-6 shadow-sm space-y-6">
            <h4 className="font-bold text-lg flex items-center gap-2 border-b pb-4"><Icons.Mail className="text-purple-600" size={20}/> خدمات البريد الإلكتروني</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <ApiKeyField label="Resend API Key" value={apiKeys.resend} onChange={updateKey('resend')} placeholder="re_..." />
              <ApiKeyField label="SendGrid API Key" value={apiKeys.sendgrid} onChange={updateKey('sendgrid')} placeholder="SG...." />
              <ApiKeyField label="Gmail API (App Password or OAuth Token)" value={apiKeys.gmail} onChange={updateKey('gmail')} placeholder="Gmail App Password" />
              <ApiKeyField label="Mailgun API Key" value={apiKeys.mailgun} onChange={updateKey('mailgun')} placeholder="key-..." />
            </div>
          </div>

          {/* WhatsApp APIs */}
          <div className="bg-white border rounded-2xl p-6 shadow-sm space-y-6">
            <h4 className="font-bold text-lg flex items-center gap-2 border-b pb-4"><Icons.MessageSquare className="text-green-600" size={20}/> واتساب للأعمال</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <ApiKeyField label="Meta WhatsApp Cloud API Token" value={apiKeys.whatsappToken} onChange={updateKey('whatsappToken')} placeholder="EAA..." />
              <ApiKeyField label="WhatsApp Phone Number ID" value={apiKeys.whatsappPhoneId} onChange={updateKey('whatsappPhoneId')} placeholder="1234..." />
              <ApiKeyField label="Twilio Account SID" value={apiKeys.twilioSid} onChange={updateKey('twilioSid')} placeholder="AC..." />
              <ApiKeyField label="Twilio Auth Token" value={apiKeys.twilioToken} onChange={updateKey('twilioToken')} placeholder="..." />
            </div>
          </div>

          {/* Scraping APIs */}
          <div className="bg-white border rounded-2xl p-6 shadow-sm space-y-6">
            <h4 className="font-bold text-lg flex items-center gap-2 border-b pb-4"><Icons.Globe className="text-amber-600" size={20}/> أدوات الزحف والبيانات</h4>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <ApiKeyField label="Apify API Token" value={apiKeys.apify} onChange={updateKey('apify')} placeholder="apify_api_..." />
              <ApiKeyField label="BrightData API Token" value={apiKeys.brightdata} onChange={updateKey('brightdata')} placeholder="..." />
            </div>
          </div>

          <div className="p-5 bg-blue-50 rounded-2xl border border-blue-100 flex items-start gap-3">
            <Icons.Shield className="text-blue-600 shrink-0 mt-0.5" size={20} />
            <p className="text-sm text-blue-900 leading-relaxed font-medium">تشفير محلي: تُحفظ المفاتيح في متصفحك فقط (LocalStorage) ولا يتم إرسالها لأي خادم خارجي. تأكد من عدم مشاركة هذا الجهاز مع آخرين غير موثوقين.</p>
          </div>
        </div>
      );
    };

    const ApiKeyField = ({ label, value, onChange, placeholder }) => (
      <div className="space-y-1.5">
        <label className="block text-xs font-bold text-gray-600 uppercase">{label}</label>
        <input
          type="password"
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          className="w-full bg-gray-50 border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none font-mono text-left"
          dir="ltr"
        />
      </div>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
